plugins {
    id("com.android.library")
    id("kotlin-android")
//    id 'androidx.navigation.safeargs.kotlin'
    // JsonToKotlinClass Parcelize plugin
    // https://github.com/wuseal/JsonToKotlinClass/blob/master/doc/parceable_support_tip.md
    id 'kotlin-parcelize'
    id("kotlin-kapt")
    // https://github.com/google/ksp
    id("com.google.devtools.ksp").version('2.3.6')
}

android {

    namespace 'com.zzkj.structure'
    compileSdk rootProject.ext.targetSdkVersion

    defaultConfig {
        minSdk = 24

        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }

        /**
         * 在模块中默认没有BuildConfig.VERSION_CODE了
         */
        buildConfigField "String", "VERSION_NAME", "\"$rootProject.ext.versionName\""
        buildConfigField "int", "VERSION_CODE", "$rootProject.ext.versionCode"
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'proguard-rules.pro'
        }
        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    buildFeatures {
        buildConfig = true
        dataBinding = true
    }
    lint {
        targetSdk rootProject.ext.targetSdkVersion
    }
    testOptions {
        targetSdk rootProject.ext.targetSdkVersion
    }
}

dependencies {

    compileOnly files('src/main/jniLibs/layoutlib.jar')
    implementation fileTree(include: ['*.jar'], dir: 'src/main/jniLibs', excludes: ["layoutlib.jar"])


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // https://github.com/material-components/material-components-android
    api 'com.google.android.material:material:1.13.0'

    // https://developer.android.com/jetpack/androidx/releases/appcompat
    api 'androidx.appcompat:appcompat:1.7.1'
    // https://developer.android.com/jetpack/androidx/releases/core
    api 'androidx.core:core-ktx:1.12.0'

    api 'androidx.recyclerview:recyclerview:1.4.0'
    api "androidx.constraintlayout:constraintlayout:2.2.1"
    api 'androidx.fragment:fragment-ktx:1.8.9'

    api 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    api 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    api 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'

    api 'androidx.navigation:navigation-fragment-ktx:2.8.5'
    api 'androidx.navigation:navigation-ui-ktx:2.8.5'

    api 'androidx.paging:paging-runtime-ktx:3.5.0'
    api "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"

    // https://developer.android.google.cn/jetpack/androidx/releases/room
    testApi 'androidx.room:room-testing:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'
    api 'androidx.room:room-ktx:2.8.4'
    api 'androidx.room:room-runtime:2.8.4'
    api 'androidx.room:room-paging:2.8.4'

//    api "androidx.window:window:1.3.0" // 确保是最新版
    // https://developer.android.google.cn/jetpack/androidx/releases/datastore
//    api "androidx.datastore:datastore-preferences:1.2.0"

    // https://github.com/square/okhttp
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    api 'com.squareup.retrofit2:retrofit:3.0.0'
    api 'com.squareup.retrofit2:converter-gson:3.0.0'
    api "com.squareup.retrofit2:converter-moshi:3.0.0"
    api 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // https://github.com/square/moshi
    api 'com.squareup.moshi:moshi:1.15.2'
    ksp 'com.squareup.moshi:moshi-kotlin-codegen:1.15.2'

    // https://github.com/google/gson
    api "com.google.code.gson:gson:2.13.2"

    // https://github.com/coil-kt/coil
    api 'io.coil-kt:coil:2.7.0'
    api 'io.coil-kt:coil-video:2.7.0'
    api 'io.coil-kt:coil-gif:2.7.0'
// webpdecoder
    api "com.github.zjupure:webpdecoder:2.7.4.16.0"
// glide 4.10.0+
    api "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"


    api(libs.utilcodex)

    // https://github.com/JessYanCoding/AndroidAutoSize
//    api 'me.jessyan:autosize:1.2.1'

    // https://github.com/Tencent/MMKV
//    api 'com.tencent:mmkv-static:1.3.3'

    // https://github.com/scwang90/SmartRefreshLayout
    api 'io.github.scwang90:refresh-layout-kernel:3.0.0-alpha'
    api 'io.github.scwang90:refresh-header-classics:3.0.0-alpha'
    api 'io.github.scwang90:refresh-footer-classics:3.0.0-alpha'
    api 'io.github.scwang90:refresh-header-material:3.0.0-alpha'


    // https://github.com/getActivity/Toaster
    api 'com.github.getActivity:Toaster:12.6'
}

