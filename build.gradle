buildscript {
    dependencies {
        classpath 'com.google.gms:google-services:4.4.3'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.5'

        // https://github.com/bytedance/AabResGuard/blob/develop/wiki/zh-cn/README.md
        classpath("com.bytedance.android:aabresguard-plugin:2.0")
        // https://github.com/liujingxing/XmlClassGuard
        classpath("com.github.liujingxing:XmlClassGuard:2.0")
    }
}
plugins {
    id 'com.android.application' version '9.4.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.10' apply false
}
ext {
    // TODO 改版本
    versionName = "101"
    versionCode = 101

    targetSdkVersion = 37
}
